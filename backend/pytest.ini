[pytest]
asyncio_mode = auto
; app.db creates its async engine once at import time, bound to whatever
; event loop is active then — pytest-asyncio's default per-test loop would
; break that engine's connections on the 2nd test. One shared loop for the
; whole run keeps it bound correctly throughout.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
