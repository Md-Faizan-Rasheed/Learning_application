# ============================================================
# Quizic — Seerah master event list (38 chapters), tagged across
# all 7 division frameworks in one pass.
#
# Feeds: seerah_events + event_framework_tags (see 0015_add_campaign_map.py)
# order_no here = the chapter's global chronological position (1-38) —
# independent of campaign_stages.order_no, which only numbers the 9
# movement-stage rows.
#
# `category_slug` assumes a "seerah" row already exists in `categories` —
# change it if your actual slug differs.
#
# Under `tags`, a framework key is present only when that chapter
# genuinely belongs to one of its buckets — an upsert script should
# insert one event_framework_tags row per present key and skip the rest.
# Some chapters (mostly Phase 1, before revelation) simply don't fit
# frameworks like movement_stage or revelation_based, and that's correct,
# not a gap — they'll still show up in Origin Ladder / plain chronological
# practice via order_no, just not in modes built on those frameworks.
#
# year_hijri is left blank except where dating is essentially undisputed
# (the well-known battle/expedition years) — don't treat blanks as errors.
#
# A handful of chapters cover more ground than one tag can capture
# (e.g. Hudaybiyyah reads as both "defense_consolidation" and arguably
# "expansion_dominance" since it enabled everything after it; Ta'if reads
# as both "patience" and "forgiveness"). The schema takes one tag per
# framework per event, so I picked the more defining lens each time —
# these are editorial calls, not settled fact, so re-tag anything you'd
# place differently; nothing downstream breaks if you do.
# ============================================================

