# Alembic configuration — Islamic Learning Game
#
# The database URL is NOT stored here. env.py reads it from the
# DATABASE_URL environment variable at runtime, so credentials never
# live in the repo.
#
# IMPORTANT: run migrations against the DIRECT (non-pooled) connection
# string. DDL run through a pooled/PgBouncer endpoint in transaction
# pooling mode can silently no-op.

[alembic]
script_location = migrations
prepend_sys_path = .

# Use a UTC, sortable timestamp + slug in new migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
