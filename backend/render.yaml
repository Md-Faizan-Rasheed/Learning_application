# Render Blueprint (https://render.com/docs/blueprint-spec) for the backend.
# Deploy: connect this repo in the Render dashboard, point it at this file,
# and Render provisions the web service + database below in one go.
#
# Not covered here — add manually via the Render dashboard after the first
# deploy, since Blueprint syntax for the Key/Value (Redis) service type has
# shifted across Render's own docs and isn't worth guessing at:
#   1. Create a Key/Value (Redis) instance.
#   2. Paste its internal connection string into this service's REDIS_URL
#      env var (Dashboard -> this service -> Environment).
#
# Also not covered here — these envVars are `sync: false`, meaning Render
# will prompt for them at first deploy rather than reading a value from this
# file. Never put real secrets in this committed file.

services:
  - type: web
    name: islamic-learning-game-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "uvicorn app.main:asgi_app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: islamic-learning-game-db
          property: connectionString
      - key: REDIS_URL
        sync: false # set manually once the Key/Value instance exists — see note above
      - key: JWT_SECRET
        sync: false # generate a real random secret, never reuse the .env.example placeholder
      - key: OPENAI_API_KEY
        sync: false # optional — only needed for the teacher AI-import feature
      - key: RESEND_API_KEY
        sync: false # optional — only needed for real password-reset emails
      - key: EMAIL_FROM
        sync: false # optional — defaults to Resend's own test sender if unset
      - key: SENTRY_DSN
        sync: false # optional — only needed for crash/error reporting

databases:
  - name: islamic-learning-game-db
    plan: free
    postgresMajorVersion: "16"
