name: islamic_game
description: "Multiplayer Islamic learning card game."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.5
  socket_io_client: ^2.0.1
  shared_preferences: ^2.1.0
  intl: ^0.20.3
  http: ^0.13.5
  confetti: ^0.7.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  sentry_flutter: ^9.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 800
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 900
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B4B4A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
