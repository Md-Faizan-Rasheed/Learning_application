name: islamic_game
description: "Multiplayer Islamic learning card game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # networking
  socket_io_client: ^3.1.6
  dio: ^5.11.0

  # state + routing
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0

  # storage + formatting
  shared_preferences: ^2.5.5
  intl: ^0.20.3

  # models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true          # enables gen_l10n for ar/ur/en

